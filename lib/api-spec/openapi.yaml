          type: array
          items: { $ref: "#/components/schemas/HistoryBar" }
        currency: { type: ["string", "null"] }
        exchange: { type: ["string", "null"] }
        instrumentType: { type: ["string", "null"] }
      required: [symbol, range, interval, bars]

    InsiderTrade:
      type: object
