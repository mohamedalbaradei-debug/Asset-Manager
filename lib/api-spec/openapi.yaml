openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: AI Investment Assistant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analysis
    description: Stock analysis operations
  - name: market
    description: Market-wide data operations
  - name: panels
    description: Market intelligence panels
  - name: watchlist
    description: Watchlist management
  - name: ai
    description: AI analyst endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /search:
    get:
      operationId: getSymbolSearch
      tags: [analysis]
      summary: Live symbol search across all exchanges
      description: Searches stocks and ETFs on NYSE, LSE, Frankfurt (Xetra), Euronext and other exchanges via Yahoo.
      parameters:
        - name: q
          in: query
          required: true
          description: Search text (ticker or company name fragment)
          schema:
            type: string
      responses:
        "200":
          description: Matching symbols
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymbolSearchData"

  /analyze:
    post:
      operationId: analyzeStock
      tags: [analysis]
      summary: Analyze a stock ticker
      description: Returns full technical, fundamental, sentiment, options, macro, and AI analysis for a given ticker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisInput"
      responses:
        "200":
          description: Full analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ticker not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /macro:
    get:
      operationId: getMacroData
      tags: [market]
      summary: Get macro and market breadth data
      description: Returns latest macroeconomic indicators and market breadth/liquidity metrics
      responses:
        "200":
          description: Macro and breadth data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MacroMarketData"

  /trending:
    get:
      operationId: getTrendingTickers
      tags: [market]
      summary: Get trending/popular tickers
      description: Returns a quick snapshot of popular market tickers
      responses:
        "200":
          description: List of trending tickers with basic stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendingTicker"

  /movers:
    get:
      operationId: getMarketMovers
      tags: [panels]
      summary: Today's market movers
      responses:
        "200":
          description: Top gainers, losers, and most active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoversData"

  /sectors:
    get:
      operationId: getSectorRotation
      tags: [panels]
      summary: GICS sector rotation via SPDR ETFs
      responses:
        "200":
          description: Sector performance vs SPY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectorRotationData"

  /spyqqq:
    get:
      operationId: getSpyQqqRotation
      tags: [panels]
      summary: SPY vs QQQ rotation chart
      responses:
        "200":
          description: Normalized SPY/QQQ series and ratio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpyQqqRotation"

  /gex:
    get:
      operationId: getGexData
      tags: [panels]
      summary: SPX and VIX gamma exposure + net flow
      responses:
        "200":
          description: GEX and net delta-dollar flow for SPX and VIX
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GexResponse"

  /macro/full:
    get:
      operationId: getFullUsMacro
      tags: [panels]
      summary: Full US macro snapshot
      responses:
        "200":
          description: Extended US macro indicators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FullUsMacro"

  /macro/global:
    get:
      operationId: getGlobalMacro
      tags: [panels]
      summary: Global macro cross-country table
      responses:
        "200":
          description: Cross-country CPI and short rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalMacro"

  /fed:
    get:
      operationId: getFedData
      tags: [panels]
      summary: Fed balance sheet, primary dealers, FOMC docs
      responses:
        "200":
          description: Fed dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FedData"

  /fx:
    get:
      operationId: getFxData
      tags: [panels]
      summary: Major FX pairs with rate differentials
      responses:
        "200":
          description: FX spot and carry data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxData"

  /valuation:
    get:
      operationId: getValuationData
      tags: [panels]
      summary: S&P 500 valuation metrics
      responses:
        "200":
          description: PE, CAPE, earnings yield, dividend yield
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValuationData"

  /shipping:
    get:
      operationId: getShippingData
      tags: [panels]
      summary: Shipping chokepoint transit data
      responses:
        "200":
          description: IMF PortWatch transit volumes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingData"

  /news:
    get:
      operationId: getLatestNews
      tags: [panels]
      summary: Latest market headlines
      responses:
        "200":
          description: Aggregated news with sentiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsData"

  /etfs:
    get:
      operationId: getEtfTracker
      tags: [panels]
      summary: ETF performance tracker
      description: >
        Curated universe of liquid US-listed ETFs grouped by category with
        price, daily change and trailing performance windows (1W/1M/3M/6M/YTD/
        1Y/3Y) plus expense ratios, from the TradingView scanner.
      responses:
        "200":
          description: ETF groups with recent performance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EtfTrackerData"

  /stocks/{symbol}/detail:
    get:
      operationId: getStockDetail
      tags: [panels]
      summary: OpenAlice-style stock detail bundle
      description: >
        Quote stats from Yahoo chart meta, fundamentals from the TradingView
        scanner, five fiscal years of financial statements from SEC EDGAR XBRL
        and a corporate profile parsed from Wikipedia.
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stock detail bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockDetail"
        "404":
          description: Unknown ticker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stocks/{symbol}/history:
    get:
      operationId: getStockHistory
      tags: [panels]
      summary: Price history bars for the interactive chart
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: range
          in: query
          schema:
            type: string
            enum: ["1D", "5D", "1M", "3M", "1Y", "5Y", "ALL"]
            default: "1Y"
        - name: interval
          in: query
          schema:
            type: string
            enum: ["1m", "2m", "5m", "15m", "30m", "1h", "1d", "1wk", "1mo", "3mo"]
          description: Must be valid for the chosen range; falls back to the range default otherwise.
      responses:
        "200":
          description: OHLCV bars
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryData"
        "404":
          description: No history available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stocks/{symbol}/insiders:
    get:
      operationId: getStockInsiders
      tags: [panels]
      summary: Recent SEC Form 4 insider transactions
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest insider trades parsed from EDGAR filings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsidersData"

  /shipping/chokepoints:
    get:
      operationId: getChokepoints
      tags: [panels]
      summary: IMF PortWatch daily chokepoint transits
      responses:
        "200":
          description: Latest-day vessel transit counts per maritime chokepoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChokepointsData"

  /petroleum:
    get:
      operationId: getPetroleumStatus
      tags: [panels]
      summary: EIA Weekly Petroleum Status Report stocks
      responses:
        "200":
          description: Weekly US oil inventories with WoW/YoY deltas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetroleumData"

  /crypto/options:
    get:
      operationId: getCryptoOptions
      tags: [panels]
      summary: Deribit crypto options chains and futures term structure
      parameters:
        - name: currency
          in: query
          schema:
            type: string
            enum: [BTC, ETH]
            default: BTC
      responses:
        "200":
          description: Option expiries with OI/max-pain and futures curve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoOptionsData"

  /news/archive:
    get:
      operationId: queryNewsArchive
      tags: [panels]
      summary: Searchable news archive collected from the live feed
      parameters:
        - name: ticker
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Archived articles matching the filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArchiveResult"

  /news/events:
    get:
      operationId: getNewsEventStudy
      tags: [panels]
      summary: Event study over archived headlines for a ticker
      parameters:
        - name: ticker
          in: query
          required: true
          schema: { type: string }
        - name: window
          in: query
          schema: { type: integer, default: 2, minimum: 1, maximum: 10 }
          description: Trading sessions ahead used to measure the post-headline return.
      responses:
        "200":
          description: Per-event-day returns vs SPY with aggregate stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventStudyResult"

  /plan/backtest:
    post:
      operationId: backtestPlan
      tags: [plan]
      summary: Historical backtest of a planner allocation vs SPY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                horizon: { type: string, enum: [short, medium, long], default: medium }
                riskTolerance: { type: string, enum: [conservative, balanced, aggressive], default: balanced }
      responses:
        "200":
          description: Indexed equity curves and risk metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestResult"

  /marketpulse:
    get:
      operationId: getMarketPulse
      tags: [panels]
      summary: Combined market pulse board
      responses:
        "200":
          description: Macro highlights, movers, sector rotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPulse"

  /watchlist:
    get:
      operationId: getWatchlist
      tags: [watchlist]
      summary: List saved tickers
      responses:
        "200":
          description: Watchlist tickers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistResponse"
    post:
      operationId: addToWatchlist
      tags: [watchlist]
      summary: Add a ticker to the watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistAddInput"
      responses:
        "200":
          description: Updated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistAddResponse"

  /watchlist/{ticker}:
    delete:
      operationId: removeFromWatchlist
      tags: [watchlist]
      summary: Remove a ticker from the watchlist
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistRemoveResponse"

  /watchlist/summary:
    get:
      operationId: getWatchlistSummary
      tags: [watchlist]
      summary: Price, daily change, RSI for watched tickers
      responses:
        "200":
          description: Watchlist summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistSummary"

  /calendar:
    get:
      operationId: getCalendar
      tags: [watchlist]
      summary: Earnings, dividends, IPO calendar
      responses:
        "200":
          description: Calendar data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarData"

  /performance:
    get:
      operationId: getPerformance
      tags: [watchlist]
      summary: Recommendation performance log summary
      responses:
        "200":
          description: Win rate summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceData"

  /ai/status:
    get:
      operationId: getAiStatus
      tags: [ai]
      summary: AI free quota status
      responses:
        "200":
          description: Free quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatus"

  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Chat with the AI analyst
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatRequest"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatReply"
        "502":
          description: Provider error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatReply"

  /plan:
    post:
      operationId: createInvestmentPlan
      tags: [planner]
      summary: Build a personalized investment plan
      description: >
        Given available cash, time horizon and risk tolerance, returns a
        rule-based allocation across stocks/bonds/gold/cash with concrete ETF
        picks, scenario projections, and action steps. Optional display-currency
        conversion via ECB reference rates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "200":
          description: Investment plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    AnalysisInput:
      type: object
      properties:
        ticker:
          type: string
          description: Stock ticker symbol (e.g. AAPL, TSLA, SAP.DE, VOD.L)
          minLength: 1
          maxLength: 12
      required:
        - ticker

    SymbolSearchResult:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: ["string", "null"]
        exchange:
          type: ["string", "null"]
        type:
          type: ["string", "null"]
        price:
          type: ["number", "null"]
        currency:
          type: ["string", "null"]
      required:
        - symbol

    SymbolSearchData:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SymbolSearchResult"
      required:
        - results

    HistoricalDataPoint:
      type: object
      properties:
        date:
          type: string
        price:
          type: number
        priceNorm:
          type: number
          description: Normalized price (rebased to 100 at period start)
        spyPriceNorm:
          type: ["number", "null"]
          description: Normalized SPY price for comparison
      required:
        - date
        - price
        - priceNorm

    Candle:
      type: object
      description: Daily OHLC candle for the candlestick chart
      properties:
        date:
          type: string
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
      required:
        - date
        - open
        - high
        - low
        - close

    MacdValues:
      type: object
      properties:
        macd:
          type: number
        signal:
          type: number
        histogram:
          type: number
      required:
        - macd
        - signal
        - histogram

    TechnicalExplanations:
      type: object
      properties:
        rsi:
          type: string
        macd:
          type: string
        sma50:
          type: string
        sma200:
          type: string
      required:
        - rsi
        - macd
        - sma50
        - sma200

    RecommendationDetail:
      type: object
      description: A recommendation for either a trader (short-term technical) or investor (long-term fundamental)
      properties:
        recommendation:
          type: string
          description: "One of: STRONG BUY, BUY, HOLD, SELL, STRONG SELL"
        score:
          type: number
          description: Composite score driving recommendation
        rationale:
          type: array
          items:
            type: string
          description: Specific sentences explaining why this recommendation was reached
      required:
        - recommendation
        - score
        - rationale

    SentimentHeadline:
      type: object
      properties:
        title:
          type: string
        score:
          type: number
        label:
          type: string
      required:
        - title
        - score
        - label

    SentimentReport:
      type: object
      properties:
        available:
          type: boolean
        compound:
          type: number
        label:
          type: string
          description: "One of: Bullish, Neutral, Bearish"
        explanation:
          type: string
        headlines:
          type: array
          items:
            $ref: "#/components/schemas/SentimentHeadline"
        source:
          type: string
      required:
        - available
        - compound
        - label
        - explanation
        - headlines
        - source

    OptionsFlowResult:
      type: object
      properties:
        available:
          type: boolean
        ticker:
          type: string
        expiration:
          type: ["string", "null"]
        putCallVolumeRatio:
          type: ["number", "null"]
        putCallOpenInterestRatio:
          type: ["number", "null"]
        totalCallVolume:
          type: number
        totalPutVolume:
          type: number
        totalOpenInterest:
          type: number
        unusualActivity:
          type: boolean
        unusualNote:
          type: ["string", "null"]
        premiumFlow:
          type: ["number", "null"]
        signal:
          type: string
          description: "One of: bullish, bearish, neutral"
        interpretation:
          type: string
      required:
        - available
        - ticker
        - signal
        - interpretation

    GreeksSnapshot:
      type: object
      properties:
        available:
          type: boolean
        ticker:
          type: string
        spot:
          type: ["number", "null"]
        expiration:
          type: ["string", "null"]
        strike:
          type: ["number", "null"]
        call:
          type: ["object", "null"]
          properties:
            delta:
              type: number
            gamma:
              type: number
            charm:
              type: number
        put:
          type: ["object", "null"]
          properties:
            delta:
              type: number
            gamma:
              type: number
            charm:
              type: number
        explanation:
          type: string
        signal:
          type: string
        signalNote:
          type: string
      required:
        - available
        - ticker
        - explanation
        - signal
        - signalNote

    MarketInternals:
      type: object
      properties:
        trin:
          type: ["number", "null"]
        trinSignal:
          type: string
        trinExplanation:
          type: string
        tnxYield:
          type: ["number", "null"]
        liquidityAssessment:
          type: string
          description: "One of: ample, moderate, tight, unknown"
        liquidityExplanation:
          type: string
      required:
        - trinSignal
        - trinExplanation
        - liquidityAssessment
        - liquidityExplanation

    FairValue:
      type: object
      properties:
        targetMeanPrice:
          type: ["number", "null"]
        percentDifference:
          type: ["number", "null"]
        label:
          type: string
          description: "One of: Undervalued, Overvalued, Fairly valued"
        explanation:
          type: string
      required:
        - label
        - explanation

    PriceVsEps:
      type: object
      properties:
        dates:
          type: array
          items:
            type: string
        eps:
          type: array
          items:
            type: number
        price:
          type: array
          items:
            type: number

    AiReport:
      type: object
      properties:
        available:
          type: boolean
        content:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        provider:
          type: ["string", "null"]
        note:
          type: ["string", "null"]

    AnalysisResult:
      type: object
      properties:
        ticker:
          type: string
        companyName:
          type: ["string", "null"]
        currentPrice:
          type: number
        priceChange:
          type: ["number", "null"]
          description: Price change today in dollars
        priceChangePct:
          type: ["number", "null"]
          description: Price change today as percentage
        rsi:
          type: number
        macd:
          $ref: "#/components/schemas/MacdValues"
        sma50:
          type: number
        sma200:
          type: number
        support:
          type: number
        resistance:
          type: number
        peRatio:
          type: ["number", "null"]
        eps:
          type: ["number", "null"]
        dividendYield:
          type: ["number", "null"]
        marketCap:
          type: ["number", "null"]
        volume:
          type: ["number", "null"]
        avgVolume:
          type: ["number", "null"]
        fiftyTwoWeekHigh:
          type: ["number", "null"]
        fiftyTwoWeekLow:
          type: ["number", "null"]
        explanations:
          $ref: "#/components/schemas/TechnicalExplanations"
        historicalData:
          type: array
          items:
            $ref: "#/components/schemas/HistoricalDataPoint"
        ohlc1y:
          type: array
          description: One year of daily OHLC candles for the candlestick chart
          items:
            $ref: "#/components/schemas/Candle"
        news:
          type: array
          items:
            type: string
        recommendation:
          type: string
          description: "Combined recommendation. One of: STRONG BUY, BUY, HOLD, SELL, STRONG SELL"
        score:
          type: number
          description: Combined composite score
        traderRec:
          $ref: "#/components/schemas/RecommendationDetail"
          description: Short-term recommendation based on technical signals (RSI, MACD, momentum, support/resistance)
        investorRec:
          $ref: "#/components/schemas/RecommendationDetail"
          description: Long-term recommendation based on fundamental and trend signals (P/E, SMA200, 52-week range, dividend)
        fairValue:
          type: ["object", "null"]
          $ref: "#/components/schemas/FairValue"
        priceVsEps:
          type: ["object", "null"]
          $ref: "#/components/schemas/PriceVsEps"
        newsSentiment:
          type: ["object", "null"]
          $ref: "#/components/schemas/SentimentReport"
        socialSentiment:
          type: ["object", "null"]
          $ref: "#/components/schemas/SentimentReport"
        marketInternals:
          type: ["object", "null"]
          $ref: "#/components/schemas/MarketInternals"
        optionsFlow:
          type: ["object", "null"]
          $ref: "#/components/schemas/OptionsFlowResult"
        greeks:
          type: ["object", "null"]
          $ref: "#/components/schemas/GreeksSnapshot"
        macroContext:
