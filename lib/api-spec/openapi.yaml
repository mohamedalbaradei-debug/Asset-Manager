          type: array
          items: { $ref: "#/components/schemas/ChokepointRow" }
        date: { type: ["string", "null"], format: date }
        updatedAt: { type: string }
      required: [chokepoints, updatedAt]

    StockSeries:
      type: object
      properties:
        label: { type: string }
