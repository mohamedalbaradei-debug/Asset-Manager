        insider: { type: string }
        role: { type: ["string", "null"] }
        action: { type: string, enum: [buy, sell, option, gift, award, other] }
        code: { type: string }
        shares: { type: ["number", "null"] }
        price: { type: ["number", "null"] }
        valueUsd: { type: ["number", "null"] }
        afterOwnship: { type: ["number", "null"] }
      required: [filedAt, insider, action, code]

    InsidersData:
      type: object
      properties:
