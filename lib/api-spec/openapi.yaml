    HistoryBar:
      type: object
      properties:
        t: { type: string, description: ISO timestamp }
        o: { type: ["number", "null"] }
        h: { type: ["number", "null"] }
        l: { type: ["number", "null"] }
        c: { type: number }
        v: { type: ["number", "null"] }
      required: [t, c]

    HistoryData:
      type: object
      properties:
        symbol: { type: string }
        range: { type: string }
        interval: { type: string }
